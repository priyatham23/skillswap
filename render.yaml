# ==============================================================================
# Render Blueprint Specification for SkillSwap
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  - type: web
    name: skillswap
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /index.html
    envVars:
      - key: PORT
        value: 8080
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

